project:
  name: data_efficient_white_box_monitoring
  phase: frontier_protocol_rebuild
  target_track: major_ml_conference_main
  paper_direction: white_box_gain_over_transcript_monitors_under_distribution_shift

task_families:
  primary: sycophancy
  transfer:
    - motivated_reasoning
  stress_tests:
    - cot_distortion
  auxiliary_controls:
    - honesty_control

# Pilot models only. The frozen study must register at least three genuinely
# different current families.
models:
  - name: Qwen3-4B
    model_id: Qwen/Qwen3-4B
    revision: 1cfa9a7208912126459214e8b04321603b3df60c
    block_indices: [7, 15, 23, 31]
  - name: Qwen3-8B
    model_id: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    block_indices: [7, 15, 23, 31]

features:
  layer_semantics: zero_based_transformer_block_output
  default_view: answer
  pooling_modes: [mean, last]

group_splitting:
  enabled: true
  default_key: question_id
  source_of_truth: scenario_protocol_split

operating_point:
  max_fpr: 0.01
  pilot_min_benign_negatives: 1000
  final_min_benign_negatives: 10000
  threshold_source: dedicated_benign_calibration

dataset_prep:
  source_lock: experiments/data/huggingface_source_lock.yaml
  fetch_script: scripts/fetch_exact_hf_sources.py
  scenario_builder: scripts/build_on_policy_scenarios.py
  rollout_generator: cli.generate_task_rollouts
  verifier: cli.verify_rollout_labels
  annotation_merger: cli.merge_rollout_labels
  audit: cli.audit_rollout_dataset
  legacy_synthetic_builder: blocked

intervention:
  enabled: false
  reason: deferred_until_monitoring_beats_registered_black_box_baselines

task_data:
  sycophancy: data/labeled/MODEL/sycophancy.jsonl
  motivated_reasoning: data/labeled/MODEL/motivated_reasoning.jsonl
  cot_distortion: data/labeled/MODEL/cot_distortion.jsonl
  honesty_control: data/labeled/MODEL/honesty_control.jsonl

pipeline:
  text_baselines: cli.run_text_baselines
  activation_extraction: cli.extract_task_activations
  probe_sweep: cli.run_task_sweep
  aggregation: cli.aggregate_task_results
  frozen_selection: cli.build_frozen_transfer_report
  paired_inference: cli.compute_task_significance
  claim_tests: cli.run_claim_tests
  final_validator: cli.validate_multimodel_config
