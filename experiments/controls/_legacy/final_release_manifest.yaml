protocol_version: frontier-v1
protocol_stage: legacy_blocked
blocked_reason: Authored-completion mainline release benchmark is incompatible with frontier protocol
max_fpr: 0.01
min_calibration_negatives: 1000

results_dir: phase6_final_release_results
overwrite: false
bootstrap_samples: 500
views: full_text,pressure_context,answer,reasoning
layers: all
probes: P1_logistic,P2_mass_mean,P3_lda,P4_cosine,P7_mahalanobis
k_values: 1,2,4,8,16
seeds: 10
balance_modes: balanced,imbalanced

calibration_pairs:
  - source_task: sycophancy
    target_task: sycophancy

transfer_pairs:
  - source_task: sycophancy
    target_task: motivated_reasoning
  - source_task: sycophancy
    target_task: cot_distortion

models:
  - name: Qwen3-4B
    feature_dirs:
      sycophancy: outputs/final_features/Qwen3-4B/sycophancy_main
      motivated_reasoning: outputs/final_features/Qwen3-4B/motivated_reasoning_main
      cot_distortion: outputs/final_features/Qwen3-4B/cot_distortion_main
  - name: Qwen3-8B
    feature_dirs:
      sycophancy: outputs/final_features/Qwen3-8B/sycophancy_main
      motivated_reasoning: outputs/final_features/Qwen3-8B/motivated_reasoning_main
      cot_distortion: outputs/final_features/Qwen3-8B/cot_distortion_main
  - name: Gemma-2-9b
    feature_dirs:
      sycophancy: outputs/final_features/Gemma-2-9b/sycophancy_main
      motivated_reasoning: outputs/final_features/Gemma-2-9b/motivated_reasoning_main
      cot_distortion: outputs/final_features/Gemma-2-9b/cot_distortion_main
