protocol_version: frontier-v1
protocol_stage: pilot
run_black_box_baselines: false
run_falsification_suite: false
falsification_registry: experiments/protocol/falsification_registry.yaml
black_box_baselines:
  - B1_text_tfidf
  - B2_text_embedding_logistic
  - B3_llm_judge_zero_shot
  - B3_llm_judge_few_shot
  - B4_output_confidence_logistic
text_embedding_model_lock: experiments/baselines/text_embedding_models.yaml
text_embedding_model_key: qwen3_embedding_0_6b
text_embedding_views:
  - prompt_text
  - answer_text
  - transcript_text
llm_judge_model_lock: experiments/baselines/llm_judge_models.yaml
llm_judge_model_key: phi4_14b
llm_judge_batch_size: 8
llm_judge_views:
  - prompt_text
  - answer_text
  - transcript_text
llm_judge_modes:
  - zero_shot
  - few_shot
benign_screening_audit:
  protocol: benign-screening-audit-v1
  scope: per_monitored_model_revision
  screener_model_lock: experiments/baselines/benign_screening_models.yaml
  screener_model_keys_by_monitored_family:
    Qwen3:
      - phi4_mini_benign
      - olmo2_1b_benign
      - mistral_7b_benign
    Llama3.1:
      - phi4_mini_benign
      - olmo2_1b_benign
      - mistral_7b_benign
    Mistral:
      - phi4_mini_benign
      - olmo2_1b_benign
      - granite_8b_benign
  min_screeners: 3
  random_audit_size: 300
  risk_audit_size: 0
  selection_seed: 9173
  confidence_level: 0.95
  max_false_acceptance_rate: 0.01
results_dir: phase4_real_main_results
overwrite: false
bootstrap_samples: 1000
views: answer
layers: all
probes: P1_logistic,P2_mass_mean,P3_lda,P7_mahalanobis
k_values: 1,4,8
seeds: 10
balance_modes: balanced
max_fpr: 0.01
min_calibration_negatives: 1000

task_pairs:
  - source_task: sycophancy
    target_task: motivated_reasoning
  - source_task: sycophancy
    target_task: cot_distortion

models:
  - name: Qwen3-4B
    model_id: Qwen/Qwen3-4B
    model_revision: 1cfa9a7208912126459214e8b04321603b3df60c
    family: Qwen3
    feature_dirs:
      sycophancy: outputs/final_features/Qwen3-4B/sycophancy_main
      motivated_reasoning: outputs/final_features/Qwen3-4B/motivated_reasoning_main
      cot_distortion: outputs/final_features/Qwen3-4B/cot_distortion_main
  - name: Qwen3-8B
    model_id: Qwen/Qwen3-8B
    model_revision: b968826d9c46dd6066d109eabc6255188de91218
    family: Qwen3
    feature_dirs:
      sycophancy: outputs/final_features/Qwen3-8B/sycophancy_main
      motivated_reasoning: outputs/final_features/Qwen3-8B/motivated_reasoning_main
      cot_distortion: outputs/final_features/Qwen3-8B/cot_distortion_main
  - name: DeepSeek-R1-Distill-Llama-8B
    model_id: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    model_revision: 6a6f4aa4197940add57724a7707d069478df56b1
    family: Llama3.1
    feature_dirs:
      sycophancy: outputs/final_features/DeepSeek-R1-Distill-Llama-8B/sycophancy_main
      motivated_reasoning: outputs/final_features/DeepSeek-R1-Distill-Llama-8B/motivated_reasoning_main
      cot_distortion: outputs/final_features/DeepSeek-R1-Distill-Llama-8B/cot_distortion_main
  - name: Mistral-7B-Instruct-v0.3
    model_id: mistralai/Mistral-7B-Instruct-v0.3
    model_revision: c170c708c41dac9275d15a8fff4eca08d52bab71
    family: Mistral
    feature_dirs:
      sycophancy: outputs/final_features/Mistral-7B-Instruct-v0.3/sycophancy_main
      motivated_reasoning: outputs/final_features/Mistral-7B-Instruct-v0.3/motivated_reasoning_main
      cot_distortion: outputs/final_features/Mistral-7B-Instruct-v0.3/cot_distortion_main
