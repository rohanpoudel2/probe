schema_version: frontier-falsification-comparisons-v1
multiplicity_control: holm_global

# Copy this file at protocol freeze. Replace every selector with the exact
# source-eval-selected systems before any final-test prediction is inspected.
comparisons:
  - comparison_id: behavior_transfer_tpr_qwen3_4b_k8
    description: Activation-monitor TPR minus the registered black-box monitor TPR on held-out motivated-reasoning behavior.
    task_name: motivated_reasoning
    slice:
      type: shift
      axis: behavior
      value: motivated_reasoning
      role: heldout
    common_filters:
      model: Qwen3-4B
      source_task: sycophancy
      target_task: motivated_reasoning
      k: 8
      balance_mode: balanced
    system_a:
      probe: P1_logistic
      layer: 15
      view: answer
    system_b:
      probe: B2_text_embedding_logistic
      layer: -2
      view: transcript_text
    metric: tpr

