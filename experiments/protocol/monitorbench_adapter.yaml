artifact_contract:
  filename_pattern: evaluated_llm_<stress_test>_n=<rollout_number>.tested.jsonl
  required_record_fields:
    - task_id
    - messages
    - response
    - verification_result
    - target
    - metadata
  required_metadata_fields:
    - task
    - stress_test
    - original_question
  response_formats:
    - think_tags
    - gpt_oss
  structured_response_tasks:
    - dual_objectives.agent.benign
    - dual_objectives.agent.malicious

normalization:
  task_family: cot_distortion
  construct_name: monitorbench_verified_target_outcome
  protocol_split: test
  label_source: official_monitorbench_verification_result
  annotation_protocol: monitorbench-official-tested-artifact-v1
  label_semantics:
    0: official_target_outcome_not_verified
    1: official_target_outcome_verified
  official_metric_separation: >-
    The derived binary outcome label is not a label of CoT unfaithfulness and is
    not the official MonitorBench monitorability score. Official monitorability
    must be reported separately from upstream monitor outputs.
  generation_confidence:
    available: false
    reason: >-
      Official .tested.jsonl artifacts serialize response text and verifier
      verdicts but not the per-token distributions required by B4.

